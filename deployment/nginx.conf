# ORBITA Nginx Configuration for AWS EC2
# This file is automatically copied to /etc/nginx/sites-available/orbita by start.sh

server {
    listen 80;
    server_name _; # Change to your actual domain or IP address

    # Path to the built frontend assets for Mission Control
    root /var/www/orbita/mission-control/dist;
    index index.html;

    # Single Page Application routing (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─────────────────────────────────────────────────────────────────
    # BACKEND API PROXIES (Mirrored from mission-control vite.config.ts)
    # ─────────────────────────────────────────────────────────────────

    # Auth Service
    location /api/auth/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }
    location /api/brands/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }
    location /api/organizations/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }
    location /api/projects/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # Discover Orbit
    location /api/discover/ {
        rewrite ^/api/discover/(.*) /api/v1/$1 break;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
    }

    # Knowledge Core
    location /api/knowledge/ {
        rewrite ^/api/knowledge/(.*) /api/$1 break;
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
    }

    # Create Orbit
    location /api/create/ {
        rewrite ^/api/create/(.*) /api/$1 break;
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
    }

    # Optimize Orbit
    location /api/optimize/ {
        rewrite ^/api/optimize/(.*) /api/$1 break;
        proxy_pass http://127.0.0.1:8004;
        proxy_set_header Host $host;
    }

    # Visibility Orbit
    location /api/visibility/ {
        rewrite ^/api/visibility/(.*) /api/v1/$1 break;
        proxy_pass http://127.0.0.1:8005;
        proxy_set_header Host $host;
    }
}
